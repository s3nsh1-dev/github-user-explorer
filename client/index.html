<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- These live in client/public/, which Vite copies to the site root
         unhashed — the right place for files a browser asks for by a fixed
         name. The old favicon was a 1.4 MB PNG served from src/assets and
         declared type="image/svg+xml", which it never was. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
      rel="stylesheet"
    />
    <title>GitHub User Explorer</title>

    <meta
      name="description"
      content="Search any GitHub user or organization and explore their profile, repositories, and contribution history."
    />

    <!-- Link previews in Slack, Discord, iMessage and every social card.
         og:image is deliberately absent: pointing at an image that does not
         exist yet renders a broken preview, which is worse than a text-only
         one. Add it with a real 1200x630 capture of the profile page. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GitHub User Explorer" />
    <meta
      property="og:description"
      content="Search any GitHub user or organization and explore their profile, repositories, and contribution history."
    />
    <meta property="og:url" content="https://github-userexplorer.netlify.app/" />
    <meta name="twitter:card" content="summary" />

    <!-- Matches theme.palette.background.default in theme/muiCustomTheme.ts,
         so the browser chrome agrees with the page instead of framing it. -->
    <meta
      name="theme-color"
      content="#e0e0e0"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#23272b"
      media="(prefers-color-scheme: dark)"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
