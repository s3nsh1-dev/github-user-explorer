<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="./src/assets/github-logo-cropped.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
      rel="stylesheet"
    />
    <title>GitHub User Explorer</title>

    <meta
      name="description"
      content="Search any GitHub user or organization and explore their profile, repositories, and contribution history."
    />

    <!-- Link previews in Slack, Discord, iMessage and every social card.
         og:image is deliberately absent: pointing at an image that does not
         exist yet renders a broken preview, which is worse than a text-only
         one. Add it with a real 1200x630 capture of the profile page. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GitHub User Explorer" />
    <meta
      property="og:description"
      content="Search any GitHub user or organization and explore their profile, repositories, and contribution history."
    />
    <meta property="og:url" content="https://github-userexplorer.netlify.app/" />
    <meta name="twitter:card" content="summary" />

    <!-- Matches theme.palette.background.default in theme/muiCustomTheme.ts,
         so the browser chrome agrees with the page instead of framing it. -->
    <meta
      name="theme-color"
      content="#e0e0e0"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#23272b"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Anti-flash. The page is white until React mounts, mounts the theme and
         CssBaseline paints the background, so a dark-mode visitor got a white
         flash on every load and every hard refresh.

         ⚠️ This MUST agree with readMode() in src/helper/storage.ts: same
         "mode" key, same accepted values, same prefers-color-scheme fallback.
         Disagree and it flashes in the *opposite* direction, which is worse
         than not having it. The two colours are theme.palette.background.default
         from src/theme/muiCustomTheme.ts.

         ⚠️ It is inline, so netlify.toml's script-src carries its SHA-256.
         Editing a single character here — including whitespace — invalidates
         that hash, and the browser then drops the script silently: no error,
         no console warning, just the flash back. After changing anything in
         here run `npm run build && npm run csp-hash`, which prints the hash
         and fails if netlify.toml is missing it. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem("mode");
          if (m !== "light" && m !== "dark") {
            m =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          document.documentElement.style.backgroundColor =
            m === "dark" ? "#23272b" : "#e0e0e0";
        } catch (e) {
          /* storage disabled: fall through to the default paint */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
